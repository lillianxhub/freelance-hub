# Frontend: GitHub Actions checks PRs and branch pushes; Vercel Git integration handles deployments.
name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend || steps.push.outputs.frontend }}

    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v5

      - name: Filter pull request changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'code/Frontend/**'
              - '.github/workflows/frontend-ci.yml'

      - name: Mark push as frontend change
        if: github.event_name == 'push'
        id: push
        run: echo "frontend=true" >> "$GITHUB_OUTPUT"

  test:
    name: Test frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

  frontend-gate:
    name: Frontend gate
    needs:
      - changes
      - test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check frontend job result
        env:
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$FRONTEND_CHANGED" != "true" ]; then
            echo "No Frontend changes detected; Frontend checks are not required."
            exit 0
          fi

          if [ "$TEST_RESULT" != "success" ]; then
            echo "Frontend checks did not succeed: $TEST_RESULT"
            exit 1
          fi

          echo "All Frontend checks succeeded."
