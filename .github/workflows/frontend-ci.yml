name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'code/Frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - dev
      - main
    paths:
      - 'code/Frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: code/Frontend

jobs:
  test:
    name: Test frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          VITE_API_BASE_URL: /api
        run: npm run build
