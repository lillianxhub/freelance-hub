name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_DIR: code/Backend

jobs:
  main-pr-source:
    name: Main PR must come from dev
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check pull request source branch
        env:
          PR_HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$PR_HEAD_BRANCH" != "dev" ]; then
            echo "Pull requests into main must come from dev."
            echo "Received source branch: $PR_HEAD_BRANCH"
            exit 1
          fi

  test:
    name: Test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ env.BACKEND_DIR }}/pom.xml

      - name: Make Maven wrapper executable
        working-directory: ${{ env.BACKEND_DIR }}
        run: chmod +x mvnw

      - name: Run tests
        working-directory: ${{ env.BACKEND_DIR }}
        run: ./mvnw --batch-mode --no-transfer-progress verify

  migration:
    name: Validate Flyway migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: freelance_hub
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d freelance_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run migrations against an empty PostgreSQL database
        run: >-
          docker run --rm --network host
          -v "$GITHUB_WORKSPACE/${{ env.BACKEND_DIR }}/src/main/resources/db/migration:/flyway/sql:ro"
          flyway/flyway:11.14.1
          -url=jdbc:postgresql://localhost:5432/freelance_hub
          -user=ci_user
          -password=ci_password
          -schemas=public
          -locations=filesystem:/flyway/sql
          -connectRetries=30
          migrate

      - name: Validate migration history
        run: >-
          docker run --rm --network host
          -v "$GITHUB_WORKSPACE/${{ env.BACKEND_DIR }}/src/main/resources/db/migration:/flyway/sql:ro"
          flyway/flyway:11.14.1
          -url=jdbc:postgresql://localhost:5432/freelance_hub
          -user=ci_user
          -password=ci_password
          -schemas=public
          -locations=filesystem:/flyway/sql
          validate

  docker:
    name: Build Docker image
    needs:
      - test
      - migration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build backend image
        run: docker build --tag freelance-hub-backend:${{ github.sha }} ${{ env.BACKEND_DIR }}

      - name: Start PostgreSQL for runtime smoke test
        run: |
          docker network create backend-ci
          docker run --detach \
            --name backend-ci-postgres \
            --network backend-ci \
            --env POSTGRES_DB=freelance_hub \
            --env POSTGRES_USER=ci_user \
            --env POSTGRES_PASSWORD=ci_password \
            postgres:16-alpine

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker exec backend-ci-postgres pg_isready -U ci_user -d freelance_hub; then
              exit 0
            fi
            sleep 2
          done
          docker logs backend-ci-postgres
          exit 1

      - name: Start backend and run Flyway
        run: |
          docker run --detach \
            --name backend-ci-app \
            --network backend-ci \
            --publish 8080:8080 \
            --env SPRING_DATASOURCE_URL=jdbc:postgresql://backend-ci-postgres:5432/freelance_hub \
            --env SPRING_DATASOURCE_USERNAME=ci_user \
            --env SPRING_DATASOURCE_PASSWORD=ci_password \
            --env SPRING_JPA_DEFAULT_SCHEMA=public \
            --env SPRING_FLYWAY_SCHEMAS=public \
            --env JWT_SECRET=ci-only-secret-that-is-long-enough-for-jwt-signing \
            --env CORS_ALLOWED_ORIGINS=http://localhost:5173 \
            freelance-hub-backend:${{ github.sha }}

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs backend-ci-app
          exit 1

      - name: Verify migrated tables
        run: |
          table_count=$(docker exec backend-ci-postgres psql -U ci_user -d freelance_hub -tAc \
            "select count(*) from information_schema.tables where table_schema = 'public' and table_name in ('users', 'user_profiles', 'clients', 'projects', 'tasks', 'time_entries', 'revoked_tokens');")
          test "$table_count" -ge 7
          docker exec backend-ci-postgres psql -U ci_user -d freelance_hub -c \
            "select installed_rank, version, description from flyway_schema_history order by installed_rank;"

      - name: Smoke test registration endpoint
        run: |
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --request POST \
            --data '{"email":"ci-${{ github.run_id }}@example.com","password":"ci-password-123","displayName":"CI Smoke Test"}' \
            http://localhost:8080/api/auth/register | grep -q 'token'

      - name: Show backend logs on failure
        if: ${{ failure() }}
        run: docker logs backend-ci-app || true

      - name: Cleanup runtime containers
        if: ${{ always() }}
        run: |
          docker rm --force backend-ci-app backend-ci-postgres || true
          docker network rm backend-ci || true
