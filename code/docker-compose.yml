name: freelance-hub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freelance_hub}
      POSTGRES_USER: ${POSTGRES_USER:-freelance_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freelance_hub_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-freelance_hub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-freelance_hub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-freelance_hub_dev}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
