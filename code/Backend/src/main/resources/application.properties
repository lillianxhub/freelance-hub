# Active Profile (use 'local' for local development with application-local.properties)
spring.profiles.active=local

# Database Configuration (production defaults - override in application-local.properties for dev)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=${SPRING_JPA_DEFAULT_SCHEMA:public}

# Flyway Configuration - DISABLED
spring.flyway.enabled=false

# JWT Configuration (override in application-local.properties or environment variables)
jwt.secret=${JWT_SECRET:your-default-secret-key-for-development-only-change-this}
jwt.expiration=${JWT_EXPIRATION:86400000}

# API Documentation
app.api.version=0.0.1
app.api.title=Freelance Hub API
app.api.description=RESTful API for managing freelance projects, clients, tasks, and time tracking

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
