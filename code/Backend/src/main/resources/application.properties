# =========================
# Local Environment
# =========================
spring.config.import=optional:file:.env[.properties]

# =========================
# Database
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/freelance_hub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:freelance_hub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=${SPRING_JPA_DEFAULT_SCHEMA:public}

# =========================
# Flyway
# =========================
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.schemas=${SPRING_FLYWAY_SCHEMAS:${SPRING_JPA_DEFAULT_SCHEMA:public}}
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.validate-on-migrate=${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:true}

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================
# CORS
# =========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =========================
# API Documentation
# =========================
app.api.version=0.0.1
app.api.title=Freelance Hub API
app.api.description=RESTful API for managing freelance projects, clients, tasks, and time tracking

# =========================
# OpenAPI / Swagger
# =========================
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.api-docs.path=/openapi.json

springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

# =========================
# Server
# =========================
server.port=${PORT:${SERVER_PORT:8080}}
server.error.include-message=always
server.error.include-binding-errors=always

# =========================
# Logging
# =========================
logging.level.root=${LOG_LEVEL:INFO}